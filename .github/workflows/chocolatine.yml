name: Chocolatine

on:
  push:
  pull_request:
    types: [opened]

env:
  MIRROR_SSH_URL: "git@github.com:F0undhack/choco.git"
  EXECUTABLES: "my_ls"

jobs:
  setup:
    name: Determine if the workflow should run
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          if [[ "$branch" == no-ga/* || "$MIRROR_SSH_URL" == *"${{ github.repository }}"* ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  check_compilation_and_coding_style:
    name: Check compilation and coding style
    needs: setup
    if: needs.setup.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    env:
      CC: epiclang
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 1

      - name: Check repo structure
        run: banana-check-repo

      - name: Build the project
        timeout-minutes: 2
        run: |
          set -o pipefail
          make 2>&1 | tee coding-style-reports.log

      - name: Annotate coding style errors
        if: always()
        run: |
          grep -E '^\./[^:]+:[0-9]+: (MAJOR|MINOR|INFO):' coding-style-reports.log > filtered.log 2>/dev/null || true
          awk -F: '{
            file=$1; sub(/^\.\//,"",file); sev=$3; rule=$4;
            gsub(/^ +| +$/,"",sev); gsub(/^ +| +$/,"",rule);
            msg=$5; for(i=6;i<=NF;i++) msg=msg":"$i; gsub(/^ +/,"",msg);
            printf "::error file=%s,line=%s,title=%s coding style error (%s)::%s\n",file,$2,sev,rule,msg
          }' filtered.log

      - name: Fail if coding style errors were found
        if: always()
        run: '[ -s filtered.log ] && exit 1 || echo "No coding style error."'

      - name: Clean build artifacts
        if: always()
        run: make clean

      - name: Verify executables
        if: always()
        run: |
          status=0
          for exe in $(echo "$EXECUTABLES" | tr ',' ' '); do
            [ ! -f "$exe" ] && echo "::error::'$exe' not found" && status=1
            [ -f "$exe" ] && [ ! -x "$exe" ] && echo "::error::'$exe' is not executable" && status=1
          done
          exit $status

  run_tests:
    name: Run tests
    needs: [setup, check_compilation_and_coding_style]
    if: success() && needs.setup.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 1

      - name: Run tests
        timeout-minutes: 2
        run: make tests_run

  push_to_mirror:
    name: Push to mirror repository
    needs: [setup, run_tests]
    if: success() && needs.setup.outputs.should_run == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ env.MIRROR_SSH_URL }}
          ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}